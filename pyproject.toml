[project]
name = "aussrc-tools"
version = "0.1.0"
description = "AusSRC data processing pipeline common Python utils"
authors = [
    {name = "Austin Shen", email = "austin.shen@csiro.au"},
]
readme = "README.md"
requires-python = ">= 3.12"

dependencies = [
    "astropy",
    "astroquery",
    "asyncpg",
    "jinja2",
    "keyring",
    "keyrings.alt",
    "matplotlib",
    "numpy",
    "python-dotenv",
    "pyvo",
    "requests",
]

[project.optional-dependencies]
casa = [
    "astropy_healpix",
    "casatasks",
    "casatools",
    "pandas",
    "pyregion",
    "regions",
]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aussrc_tools = [
    "hpx_tiles/*.json",
    "hpx_tiles/config/*.json",
    "mosaicking/templates/*.j2",
]

[tool.black]
line-length = 79
target-version = ["py312"]
